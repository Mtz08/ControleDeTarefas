{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="radar-estreito">
  <h1 class="h3 mb-3">Trocar senha</h1>
  <div class="card shadow-sm"><div class="card-body">
    {% include "_erros_form.html" %}
    <form method="post" data-trava-envio>
      {% csrf_token %}
      {% for campo in form %}{% include "_campo.html" %}{% endfor %}
      <button type="submit" class="btn btn-primary">Salvar nova senha</button>
    </form>
  </div></div>
</div>
{% endblock %}
