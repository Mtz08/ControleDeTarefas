{% extends "base.html" %}
{% block titulo %}Aguardar terceiro{% endblock %}
{% block conteudo %}
<div class="radar-estreito">
  <a class="radar-voltar" href="{% url 'demandas:detalhe' demanda.pk %}">← Voltar para a demanda</a>
  <div class="radar-pagina-topo">
    <div>
      <h1>Aguardar terceiro</h1>
      <p class="radar-pagina-sub text-break">{{ demanda.titulo }}</p>
    </div>
  </div>
  <form method="post" class="radar-cartao radar-cartao-corpo" data-trava-envio>
    {% csrf_token %}
    {{ form.versao }}
    {% include "_campo.html" with campo=form.aguardando_quem %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Marcar como aguardando</button>
      <a class="btn btn-outline-secondary" href="{% url 'demandas:detalhe' demanda.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
