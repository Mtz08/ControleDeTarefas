<form method="post" action="{% url 'demandas:acao' demanda.pk nome %}" data-trava-envio>
  {% csrf_token %}
  <input type="hidden" name="versao" value="{{ demanda.versao }}">
  <input type="hidden" name="proximo" value="{{ request.get_full_path }}">
  <button type="submit" class="btn btn-sm {{ estilo }}">{{ rotulo }}<span class="visually-hidden">: {{ demanda.titulo }}</span></button>
</form>
