{% comment %}Distribuição com barras. Variáveis: titulo, itens (Distribuicao).{% endcomment %}
<div class="col-lg-4">
  <section class="radar-cartao h-100">
    <header class="radar-secao-topo"><h2>{{ titulo }}</h2></header>
    {% if itens %}
      <table class="table">
        <tbody>
          {% for item in itens %}
            <tr>
              <th scope="row" class="fw-normal text-nowrap">{{ item.rotulo }}</th>
              <td class="w-50"><span class="radar-barra-trilho"><span class="radar-barra" data-largura="{{ item.largura }}"></span></span></td>
              <td class="text-end fw-semibold">{{ item.quantidade }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="radar-vazio">Sem dados no período.</p>
    {% endif %}
  </section>
</div>
